<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:white;font-size:16px}
:root{--sr-ink:#1b1b1b;--sr-ink-soft:#6b6b6b;--sr-ink-dim:#6b6b6b;--sr-line:#e3e3e3;--sr-white:white}
figure{margin:0;font-size:16px;width:640px}
.sr-figure-media {
  --ld-figure-ink: var(--sr-ink);
  --ld-figure-muted: var(--sr-ink-soft);
  --ld-figure-accent: var(--sr-ink);
  --ld-figure-accent-soft: var(--sr-ink-dim);
  --ld-figure-grid: var(--sr-line);
  --ld-figure-paper: var(--sr-white);
  position: relative;
  display: block;
  margin: 0 auto;
  width: fit-content;
  max-width: min(100%, 30em);
}
.sr-figure-media svg,
.sr-figure-media img,
.sr-figure-vector {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
}
.sr-read-fig[data-figure-layout="scroll"],
.sr-ex-fig[data-figure-layout="scroll"] {
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
}
.sr-read-fig[data-figure-layout="scroll"] .sr-figure-media,
.sr-ex-fig[data-figure-layout="scroll"] .sr-figure-media {
  width: 40em;
  max-width: none;
}
