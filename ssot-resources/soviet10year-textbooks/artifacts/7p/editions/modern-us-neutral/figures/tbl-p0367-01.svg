0" dominant-baseline="middle" data-label-id="src-right-heading-label" x="248" y="42" text-anchor="start">Solution</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-total-name-label" x="248" y="90" text-anchor="start">Total electrical work:</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-total-formula-label" x="248" y="122" text-anchor="start">A = UIt</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-substitution-label" x="248" y="162" text-anchor="start">A = 220 V × 5 A × 3600 s</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-exact-label" x="248" y="194" text-anchor="start">= 3,960,000 V · A · s</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-rounded-label" x="248" y="226" text-anchor="start">≈ 4,000,000 J</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-useful-label" x="248" y="288" text-anchor="start">The motor's work A₁ is useful work:</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-useful-fraction-label" x="248" y="320" text-anchor="start">80% of the total electrical work.</text><text fill="var(--ld-figure-ink, #15201f)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" dominant-baseline="middle" data-label-id="src-right-motor-formula-label" x="248" y="368" text-anchor="start">A₁ = A × motor efficiency.</text></g></svg>
